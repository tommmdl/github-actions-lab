name: Test and publish Docker Lab

on:
  push:
    branches: [main]
    paths: ['.github/workflows/**', 'scripts/**', 'source.json']
  pull_request:
    branches: [main]
    paths: ['.github/workflows/**', 'scripts/**', 'source.json']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      app_revision: ${{ steps.source.outputs.revision }}
    steps:
      - name: Checkout pipeline
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Read pinned application revision
        id: source
        run: python3 scripts/source.py >> "$GITHUB_OUTPUT"
      - name: Checkout Docker Lab
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: tommmdl/docker-lab
          ref: ${{ steps.source.outputs.revision }}
          path: app-source
          persist-credentials: false
      - name: Build once and run integration tests
        env:
          APP_REVISION: ${{ steps.source.outputs.revision }}
        run: bash scripts/test.sh
      - name: Save tested image for publication
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tested-image
          path: |
            .local/tested-image.tar
            .local/tested-image.tar.sha256
            .local/tested-image-id.txt
            .local/tested-postgres-id.txt
            .local/tested-postgres-alpine-id.txt
          include-hidden-files: true
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - name: Collect logs
        if: always()
        run: |
          mkdir -p .local
          if [ -f app-source/compose.yaml ]; then
            (cd app-source && bash scripts/compose.sh logs --no-color --tail=200 api db) > .local/compose.log 2>&1 || true
          fi
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: integration-evidence
          path: |
            app-source/.local/integration-results.json
            app-source/.local/database-security-results.json
            app-source/.local/database-upgrade-results.json
            app-source/.local/default-database-security-results.json
            app-source/.local/default-integration-results.json
            app-source/.local/postgres-alternative-results.json
            app-source/.local/postgres-alternative-api-tests.json
            app-source/.local/postgres-alternative-security-tests.json
            .local/compose.log
            .local/tested-image-id.txt
            .local/tested-postgres-id.txt
            .local/tested-postgres-alpine-id.txt
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
      - name: Clean up ephemeral runner resources
        if: always()
        run: |
          if [ -f app-source/compose.yaml ]; then
            cd app-source
            bash scripts/compose.sh down -v --remove-orphans
          fi

  publish:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download tested image
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: tested-image
          path: image
      - name: Verify and load exactly the tested image
        working-directory: image
        run: |
          sha256sum --check tested-image.tar.sha256
          docker load --input tested-image.tar
          test "$(docker image inspect docker-lab-api:local --format '{{.Id}}')" = "$(cat tested-image-id.txt)"
          test "$(docker image inspect docker-lab-postgres:local --format '{{.Id}}')" = "$(cat tested-postgres-id.txt)"
          test "$(docker image inspect docker-lab-postgres-alpine:local --format '{{.Id}}')" = "$(cat tested-postgres-alpine-id.txt)"
      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
      - name: Publish verified image
        env:
          OWNER: ${{ github.repository_owner }}
          APP_REVISION: ${{ needs.test.outputs.app_revision }}
        run: |
          RUN_TAG="run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          : > published-image.txt
          for NAME in docker-lab docker-lab-postgres docker-lab-postgres-alpine; do
            PREFIX=""
            LOCAL=docker-lab-api:local
            ID_FILE=image/tested-image-id.txt
            if [ "$NAME" = docker-lab-postgres ]; then
              PREFIX="postgres-"
              LOCAL=docker-lab-postgres:local
              ID_FILE=image/tested-postgres-id.txt
            elif [ "$NAME" = docker-lab-postgres-alpine ]; then
              PREFIX="postgres-alpine-"
              LOCAL=docker-lab-postgres-alpine:local
              ID_FILE=image/tested-postgres-alpine-id.txt
            fi
            IMAGE="ghcr.io/${OWNER,,}/docker-lab"
            for TAG in "$RUN_TAG" "app-${APP_REVISION}" latest; do
              docker tag "$LOCAL" "$IMAGE:${PREFIX}$TAG"
              docker push "$IMAGE:${PREFIX}$TAG"
            done
            DIGEST=$(docker image inspect "$IMAGE:${PREFIX}$RUN_TAG" --format '{{index .RepoDigests 0}}')
            docker pull "$DIGEST"
            test "$(docker image inspect "$DIGEST" --format '{{.Id}}')" = "$(cat "$ID_FILE")"
            printf '%s\n' "$DIGEST" >> published-image.txt
          done
          {
            echo '## Published tested API and PostgreSQL images'
            echo "- Application commit: $APP_REVISION"
            echo "- Pipeline commit: $GITHUB_SHA"
            cat published-image.txt
            echo "- Run tag: $RUN_TAG"
            echo '- All 23 integration checks passed before publication.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save publication digest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: publication
          path: published-image.txt
          retention-days: 30
      - name: Logout
        if: always()
        run: docker logout ghcr.io
