name: github-actions-lab-demo
services:
  api:
    image: ${IMAGE_REF:-ghcr.io/tommmdl/docker-lab@sha256:343f2b23294c09bea9c3250a3b3fd1f95d817acea9db0231dfaaaf406f22fbac}
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      DB_HOST: db
      DB_NAME: notes
      DB_USER: lab
      DB_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 6
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
  db:
    image: ghcr.io/tommmdl/docker-lab@sha256:3150abf7b42612192bce29be02c49880eb17f0f97c93b5527a58ae7454e97dec
    environment:
      POSTGRES_DB: notes
      POSTGRES_USER: lab
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d notes"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
secrets:
  db_password:
    file: .local/db-password
volumes:
  pgdata:
